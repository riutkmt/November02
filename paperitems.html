<script>
(() => {
  const loader = document.getElementById("page-loader");
  if (!loader) return;

  let timer;

  function hideLoader() {
    clearTimeout(timer);
    loader.classList.remove("is-visible");
  }

  // 読み込みに0.3秒以上かかった場合だけ表示
  if (document.readyState !== "complete") {
    timer = setTimeout(() => {
      loader.classList.add("is-visible");
    }, 300);

    window.addEventListener("load", hideLoader, { once: true });
  }

  // 戻る・進むで復帰したとき
  window.addEventListener("pageshow", hideLoader);
})();
</script>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const slider = document.getElementById("wedding-slider");
  if (!slider) return;

  const track = slider.querySelector(".wedding-track");
  if (!track) return;

  const originals = [...track.querySelectorAll("img")]
    .map(img => img.cloneNode(true));

  let loopWidth = 0;
  let isTouching = false;
  let resumeTimer;
  let resizeTimer;

  const speed = 0.3;

  function setupSlider() {

    track.innerHTML = "";

    // 写真を3セット並べる
    for (let i = 0; i < 3; i++) {
      originals.forEach(img => {
        track.appendChild(img.cloneNode(true));
      });
    }

    // 1セット分の正確な幅を取得
    const first = track.children[0];
    const next = track.children[originals.length];

    if (!first || !next) return;

    loopWidth =
      next.getBoundingClientRect().left -
      first.getBoundingClientRect().left;

    // 画面幅が広い場合はさらに複製
    while (
      track.scrollWidth <
      loopWidth + slider.clientWidth + 100
    ) {
      originals.forEach(img => {
        track.appendChild(img.cloneNode(true));
      });
    }

    slider.scrollLeft = 0;
  }

  function autoScroll() {

    if (!isTouching && loopWidth > 0) {

      slider.scrollLeft += speed;

      if (slider.scrollLeft >= loopWidth) {
        slider.scrollLeft -= loopWidth;
      }

    }

    requestAnimationFrame(autoScroll);
  }

  slider.addEventListener("touchstart", () => {
    isTouching = true;
    clearTimeout(resumeTimer);
  }, { passive: true });

  slider.addEventListener("touchend", () => {
    clearTimeout(resumeTimer);

    resumeTimer = setTimeout(() => {
      isTouching = false;
    }, 1500);

  }, { passive: true });

  slider.addEventListener("touchcancel", () => {
    isTouching = false;
  }, { passive: true });

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(setupSlider, 200);
  });

  // 写真の読み込み完了後に幅を計算
  Promise.all(
    originals.map(img => {
      if (img.complete) return Promise.resolve();

      return new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      });
    })
  ).then(() => {
    setupSlider();
    requestAnimationFrame(autoScroll);
  });

});

</script>
